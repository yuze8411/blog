<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨落千山的个人博客</title>
  <script>
    // 首屏渲染前应用主题，避免闪白/闪亮：优先本地保存，其次跟随系统
    try {
      var theme = localStorage.getItem('theme')
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
      if (theme === 'dark' || (theme === null && dark)) {
        document.documentElement.classList.add('dark')
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

<script src="//at.alicdn.com/t/c/font_5242354_dh9vkdg7miu.js"></script>

<style>
  .icon {
    width: 1em;
    height: 1em;
    vertical-align: -0.15em;
    fill: currentColor;
    /* 继承文字颜色，改color就能改图标颜色！ */
    overflow: hidden;
  }
</style>

</html>
