  <script>
    // 首屏渲染前应用主题，避免闪白/闪亮：优先本地保存，其次跟随系统
    try {
      var theme = localStorage.getItem('theme')
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
      if (theme === 'dark' || (theme === null && dark)) {
        document.documentElement.classList.add('dark')
      }
    } catch (e) { }
